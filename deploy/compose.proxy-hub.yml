# Liga o app à rede Docker do Caddy do Hub (projeto conciliacao-bancaria),
# que atende as portas 80/443 da VPS. O Caddy encaminha o subdomínio para
# "techsupport-app:5000".
# Ativado pelo .env:  COMPOSE_FILE=docker-compose.yml:deploy/compose.proxy-hub.yml
services:
  app:
    networks:
      default: {}
      proxy:
        aliases: [techsupport-app]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-conciliacao-bancaria_default}
